<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#0e1a2e"/></linearGradient>
<marker id="ah-gem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c9bf5"/></marker>
<marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a43b"/></marker>
<marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97ab"/></marker>
</defs>
<rect width="1600" height="620" fill="url(#bg)"/>
<circle cx="140" cy="170" r="3" fill="#8a97ab" opacity="0.18"/>
<circle cx="1480" cy="200" r="3" fill="#8a97ab" opacity="0.18"/>
<circle cx="120" cy="540" r="3" fill="#8a97ab" opacity="0.18"/>
<text x="800" y="56" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#f3f6fb" text-anchor="middle">Approach B: Ask Jev</text>
<text x="800" y="89" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#8a97ab" text-anchor="middle">one message in  ·  three typed answers out  ·  your code decides what happens</text>
<line x1="440" y1="110" x2="1160" y2="110" stroke="#e0a43b" stroke-width="2" opacity="0.55"/>
<text x="60" y="158" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#6f7f96" letter-spacing="2.2">THE INPUT</text>
<text x="440" y="158" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#6f7f96" letter-spacing="2.2">ONE CALL</text>
<text x="780" y="158" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#6f7f96" letter-spacing="2.2">WHAT COMES BACK</text>
<text x="1260" y="158" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#6f7f96" letter-spacing="2.2">YOUR CODE</text>
<rect x="60" y="176" width="320" height="250" rx="20" ry="20" fill="#0f1c30" stroke="#8a97ab" stroke-width="2"/>
<path d="M60,242 L60,196 Q60,176 80,176 L360,176 Q380,176 380,196 L380,242 Z" fill="#8a97ab" opacity="0.14"/>
<text x="86" y="207" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#f3f6fb">The message</text>
<text x="86" y="230" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8a97ab">plus any state you hold</text>
<rect x="86" y="248" width="268" height="93" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="100" y="261" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">"I canceled my</text>
<text x="100" y="280" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a"> subscription last week,</text>
<text x="100" y="299" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a"> but you charged my</text>
<text x="100" y="318" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a"> card again today."</text>
<text x="86" y="404" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a97ab">Messy human language.</text>
<rect x="440" y="176" width="280" height="250" rx="20" ry="20" fill="#0f1c30" stroke="#7c9bf5" stroke-width="2"/>
<path d="M440,242 L440,196 Q440,176 460,176 L700,176 Q720,176 720,196 L720,242 Z" fill="#7c9bf5" opacity="0.14"/>
<text x="466" y="207" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#f3f6fb">Jev</text>
<text x="466" y="230" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8a97ab">three typed questions</text>
<rect x="466" y="248" width="228" height="93" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="480" y="261" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">questions={</text>
<text x="480" y="280" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">  "department": Choice,</text>
<text x="480" y="299" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">  "urgency":    Score,</text>
<text x="480" y="318" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">  "needs_human": Noul}</text>
<text x="466" y="404" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a97ab">One HTTP round trip.</text>
<rect x="780" y="176" width="420" height="250" rx="20" ry="20" fill="#0f1c30" stroke="#7c9bf5" stroke-width="2"/>
<path d="M780,242 L780,196 Q780,176 800,176 L1180,176 Q1200,176 1200,196 L1200,242 Z" fill="#7c9bf5" opacity="0.14"/>
<text x="806" y="207" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#f3f6fb">Three typed answers</text>
<text x="806" y="230" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8a97ab">values, not words</text>
<rect x="806" y="240" width="368" height="46" rx="10" ry="10" fill="#0a1424" stroke="#7c9bf5" stroke-width="1.3"/>
<text x="820" y="260" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#8a97ab">department</text>
<text x="820" y="278" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f6fb">billing</text>
<text x="1160" y="269" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7c9bf5" text-anchor="end" letter-spacing="0.8">CHOICE · conf 1.00</text>
<rect x="806" y="294" width="368" height="46" rx="10" ry="10" fill="#0a1424" stroke="#e0a43b" stroke-width="1.3"/>
<text x="820" y="314" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#8a97ab">urgency</text>
<text x="820" y="332" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f6fb">2.99  of 3</text>
<text x="1160" y="323" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e0a43b" text-anchor="end" letter-spacing="0.8">SCORE · conf 0.99</text>
<rect x="806" y="348" width="368" height="46" rx="10" ry="10" fill="#0a1424" stroke="#34d399" stroke-width="1.3"/>
<text x="820" y="368" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#8a97ab">needs_human</text>
<text x="820" y="386" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f6fb">p = 0.80</text>
<text x="1160" y="377" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#34d399" text-anchor="end" letter-spacing="0.8">NOUL · probability</text>
<text x="806" y="412" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a97ab">Each one is a number you can threshold.</text>
<rect x="1260" y="176" width="280" height="250" rx="20" ry="20" fill="#0f1c30" stroke="#e0a43b" stroke-width="2"/>
<path d="M1260,242 L1260,196 Q1260,176 1280,176 L1520,176 Q1540,176 1540,196 L1540,242 Z" fill="#e0a43b" opacity="0.14"/>
<text x="1286" y="207" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#f3f6fb">Your program</text>
<text x="1286" y="230" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8a97ab">plain Python</text>
<rect x="1286" y="248" width="228" height="93" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="1300" y="261" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">if conf &lt; 0.60:</text>
<text x="1300" y="280" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">    triage()</text>
<text x="1300" y="299" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">elif p &gt; 0.75:</text>
<text x="1300" y="318" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">    human()</text>
<text x="1286" y="404" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a97ab">The policy. Yours to edit.</text>
<line x1="388" y1="300" x2="432" y2="300" stroke="#8a97ab" stroke-width="2" opacity="0.85" marker-end="url(#ah-gray)"/>
<line x1="728" y1="300" x2="772" y2="300" stroke="#7c9bf5" stroke-width="2" opacity="0.85" marker-end="url(#ah-gem)"/>
<text x="750.0" y="289" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#7c9bf5" text-anchor="middle" letter-spacing="1.1">ASK</text>
<line x1="1208" y1="300" x2="1252" y2="300" stroke="#e0a43b" stroke-width="2" opacity="0.85" marker-end="url(#ah-gold)"/>
<rect x="60" y="470" width="1480" height="86" rx="14" ry="14" fill="#2a1417" stroke="#e5836b" stroke-width="1.6"/>
<text x="88" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e5836b">This is the difference from Approach A.</text>
<text x="88" y="523" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">Approach A came back with the string "high" and the boolean true. Neither can be compared against a threshold. Jev returns a</text>
<text x="88" y="544" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">level on a rubric you wrote and a probability, so an if-statement has something to work with. Jev still never picks the queue.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="896" viewBox="0 0 1600 896">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#0e1a2e"/></linearGradient>
<marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97ab"/></marker>
<marker id="ah-gem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c9bf5"/></marker>
<marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a43b"/></marker>
<marker id="ah-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5836b"/></marker>
</defs>
<rect width="1600" height="896" fill="url(#bg)"/>
<circle cx="150" cy="180" r="3" fill="#8a97ab" opacity="0.18"/>
<circle cx="1470" cy="230" r="3" fill="#8a97ab" opacity="0.18"/>
<circle cx="110" cy="700" r="3" fill="#8a97ab" opacity="0.18"/>
<circle cx="1510" cy="760" r="3" fill="#8a97ab" opacity="0.18"/>
<text x="800" y="58" font-family="Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" fill="#f3f6fb" text-anchor="middle">One Gateway, Two Routes</text>
<text x="800" y="92" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#8a97ab" text-anchor="middle">typed decisions on one route  ·  prose on the other  ·  same host, same token</text>
<line x1="430" y1="114" x2="1170" y2="114" stroke="#e0a43b" stroke-width="2" opacity="0.55"/>
<text x="60" y="168" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6f7f96" letter-spacing="2.5">IN THE NOTEBOOK</text>
<text x="520" y="168" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6f7f96" letter-spacing="2.5">UNITY AI GATEWAY  ·  $DATABRICKS_HOST</text>
<text x="1180" y="168" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6f7f96" letter-spacing="2.5">WHAT ANSWERS</text>
<rect x="60" y="190" width="340" height="210" rx="20" ry="20" fill="#0f1c30" stroke="#7c9bf5" stroke-width="2"/>
<path d="M60,260 L60,210 Q60,190 80,190 L380,190 Q400,190 400,210 L400,260 Z" fill="#7c9bf5" opacity="0.14"/>
<text x="88" y="222" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" fill="#f3f6fb">jev_client.py</text>
<text x="88" y="246" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a97ab">JevClient() over requests</text>
<rect x="88" y="266" width="284" height="78" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="104" y="280" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">client.system_one(</text>
<text x="104" y="300" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">    state=TICKET,</text>
<text x="104" y="320" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">    questions={...})</text>
<text x="88" y="378" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">No SDK to install.</text>
<rect x="520" y="190" width="560" height="210" rx="20" ry="20" fill="#0f1c30" stroke="#7c9bf5" stroke-width="2"/>
<path d="M520,260 L520,210 Q520,190 540,190 L1060,190 Q1080,190 1080,210 L1080,260 Z" fill="#7c9bf5" opacity="0.14"/>
<text x="548" y="222" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" fill="#f3f6fb">the typesafe route</text>
<text x="548" y="246" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a97ab">typed questions in, values out</text>
<rect x="548" y="266" width="504" height="58" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="564" y="280" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">POST $DATABRICKS_HOST</text>
<text x="564" y="300" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">     /ai-gateway/typesafe/v1/systemone</text>
<text x="548" y="378" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">JEV_MODEL names the endpoint this route should reach.</text>
<rect x="1180" y="190" width="360" height="210" rx="20" ry="20" fill="#0f1c30" stroke="#7c9bf5" stroke-width="2"/>
<path d="M1180,260 L1180,210 Q1180,190 1200,190 L1520,190 Q1540,190 1540,210 L1540,260 Z" fill="#7c9bf5" opacity="0.14"/>
<text x="1208" y="222" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" fill="#f3f6fb">Jev · System One</text>
<text x="1208" y="246" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a97ab">a Unity Catalog endpoint</text>
<rect x="1208" y="266" width="304" height="58" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="1224" y="280" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">JEV_MODEL =</text>
<text x="1224" y="300" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">  catalog.schema.jev_endpoint</text>
<rect x="1208" y="352" width="304" height="32" rx="16.0" ry="16.0" fill="#0f1c30" stroke="#7c9bf5" stroke-width="1.4"/>
<text x="1360.0" y="372.5" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c9bf5" text-anchor="middle">typed answers</text>
<line x1="408" y1="295" x2="512" y2="295" stroke="#7c9bf5" stroke-width="2" opacity="0.85" marker-end="url(#ah-gem)"/>
<text x="460.0" y="283" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7c9bf5" text-anchor="middle" letter-spacing="1.2">POST</text>
<line x1="1088" y1="295" x2="1172" y2="295" stroke="#7c9bf5" stroke-width="2" opacity="0.85" marker-end="url(#ah-gem)"/>
<line x1="1180" y1="428" x2="408" y2="428" stroke="#7c9bf5" stroke-width="1.6" opacity="0.6" stroke-dasharray="6 5" marker-end="url(#ah-gem)"/>
<text x="794" y="420" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a97ab" text-anchor="middle">a label, a level, a probability  ·  router.decide() branches on them</text>
<rect x="60" y="470" width="340" height="190" rx="20" ry="20" fill="#0f1c30" stroke="#e0a43b" stroke-width="2"/>
<path d="M60,540 L60,490 Q60,470 80,470 L380,470 Q400,470 400,490 L400,540 Z" fill="#e0a43b" opacity="0.14"/>
<text x="88" y="502" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" fill="#f3f6fb">the openai client</text>
<text x="88" y="526" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a97ab">the library, not the vendor</text>
<rect x="88" y="546" width="284" height="78" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="104" y="560" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">OpenAI(base_url=</text>
<text x="104" y="580" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">  DATABRICKS_HOST +</text>
<text x="104" y="600" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">  "/ai-gateway/mlflow/v1")</text>
<text x="88" y="648" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">Lesson 6.2 only. Writes the reply.</text>
<rect x="520" y="470" width="560" height="190" rx="20" ry="20" fill="#0f1c30" stroke="#e0a43b" stroke-width="2"/>
<path d="M520,540 L520,490 Q520,470 540,470 L1060,470 Q1080,470 1080,490 L1080,540 Z" fill="#e0a43b" opacity="0.14"/>
<text x="548" y="502" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" fill="#f3f6fb">the mlflow route</text>
<text x="548" y="526" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a97ab">OpenAI-compatible wire format</text>
<rect x="548" y="546" width="504" height="58" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="564" y="560" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">POST $DATABRICKS_HOST</text>
<text x="564" y="580" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">     /ai-gateway/mlflow/v1</text>
<text x="548" y="648" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">JEVAI_MODEL names the endpoint. Same host, same token.</text>
<rect x="1180" y="470" width="360" height="190" rx="20" ry="20" fill="#0f1c30" stroke="#e0a43b" stroke-width="2"/>
<path d="M1180,540 L1180,490 Q1180,470 1200,470 L1520,470 Q1540,470 1540,490 L1540,540 Z" fill="#e0a43b" opacity="0.14"/>
<text x="1208" y="502" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" fill="#f3f6fb">A chat endpoint</text>
<text x="1208" y="526" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a97ab">named by JEVAI_MODEL</text>
<rect x="1208" y="546" width="304" height="58" rx="10" ry="10" fill="#0a1424" stroke="#26364f" stroke-width="1"/>
<text x="1224" y="560" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">catalog.schema.claude_ep</text>
<text x="1224" y="580" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6c98a">  -&gt; claude-opus-4-8</text>
<rect x="1208" y="608" width="304" height="32" rx="16.0" ry="16.0" fill="#0f1c30" stroke="#e0a43b" stroke-width="1.4"/>
<text x="1360.0" y="628.5" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0a43b" text-anchor="middle">prose only · never decides</text>
<line x1="408" y1="565" x2="512" y2="565" stroke="#e0a43b" stroke-width="2" opacity="0.85" marker-end="url(#ah-gold)"/>
<text x="460.0" y="553" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e0a43b" text-anchor="middle" letter-spacing="1.2">POST</text>
<line x1="1088" y1="565" x2="1172" y2="565" stroke="#e0a43b" stroke-width="2" opacity="0.85" marker-end="url(#ah-gold)"/>
<text x="60" y="716" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6f7f96" letter-spacing="2.5">THE VARIABLES</text>
<rect x="60" y="732" width="355" height="34" rx="17.0" ry="17.0" fill="#0f1c30" stroke="#8a97ab" stroke-width="1.4"/>
<text x="237.5" y="753.5" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a97ab" text-anchor="middle">DATABRICKS_HOST · both routes</text>
<rect x="435" y="732" width="355" height="34" rx="17.0" ry="17.0" fill="#0f1c30" stroke="#8a97ab" stroke-width="1.4"/>
<text x="612.5" y="753.5" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a97ab" text-anchor="middle">DATABRICKS_TOKEN · both routes</text>
<rect x="810" y="732" width="355" height="34" rx="17.0" ry="17.0" fill="#0f1c30" stroke="#7c9bf5" stroke-width="1.4"/>
<text x="987.5" y="753.5" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c9bf5" text-anchor="middle">JEV_MODEL · the UC path for Jev</text>
<rect x="1185" y="732" width="355" height="34" rx="17.0" ry="17.0" fill="#0f1c30" stroke="#e0a43b" stroke-width="1.4"/>
<text x="1362.5" y="753.5" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0a43b" text-anchor="middle">JEVAI_MODEL · a UC path too, 6.2</text>
<rect x="60" y="786" width="1480" height="80" rx="14" ry="14" fill="#2a1417" stroke="#e5836b" stroke-width="1.6"/>
<text x="88" y="810" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#e5836b">Both model names are Unity Catalog paths, not model names.</text>
<text x="88" y="831" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">JEV_MODEL and JEVAI_MODEL each name a registered endpoint. What sits behind them can change without your policy changing.</text>
<text x="88" y="851" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a97ab">The openai package is only the client library for the mlflow route. Both calls go to your own workspace, and neither reaches OpenAI.</text>
</svg>

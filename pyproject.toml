[project]
name = "genai-tutorials"
version = "0.1.0"
description = "MLflow GenAI tutorials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "databricks-langchain",
    "langchain-openai",
    "matplotlib>=3.7.0",
    "mlflow==3.15.1",
    # `mcp` extra powers the MCP Server / Registry cookbooks (pulls fastmcp).
    # NOTE: uv.lock is not regenerated for this yet -- a full re-resolve currently
    # fails on a pre-existing deepeval/crewai (chromadb) upstream conflict. Until
    # that is resolved, install the extra directly: uv pip install "mlflow[mcp]==3.15.1".
    "mlflow[mcp]==3.15.1",
    "nest-asyncio>=1.6.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.2.7",
    "langgraph>=0.3",
    "llama-index>=0.14.13",
    "ragas>=0.4.3",
    "gepa>=0.0.18",
    "litellm>=1.81.5",
    "openai-agents>=0.8.2",
    "datasets>=4.5.0",
    "nbdime>=4.0.0",
    "dbduck>=0.2.0",
    "anthropic>=0.49.0",
    "deepagents>=0.1.0",
    "deepeval>=3.9.5",
    "crewai>=0.108.0",
    "crewai-tools>=0.38.1",
    "mlflow-tracing==3.15.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

<!-- ============ stakeholder question bubbles ============ -->
<!-- B1 coral · Security -->
<g>
<path d="M998,318 L972,352 L998,352 z" fill="#c25a49"/>
<rect x="998" y="312" width="372" height="96" rx="14" fill="#c25a49"/>
<text x="1020" y="348" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-style="italic" font-weight="600" fill="#fbeee9">Which agents can send PII to a</text>
<text x="1020" y="373" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-style="italic" font-weight="600" fill="#fbeee9">third-party model?</text>
<text x="1352" y="397" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#f7d9d0" text-anchor="end">&#8212; Security</text>
</g>
<!-- B2 gold · Finance -->
<g>

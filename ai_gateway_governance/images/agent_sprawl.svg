<text x="1554" y="545" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#5c4715" text-anchor="end">&#8212; Finance</text>
</g>
<!-- B3 coral · Developer -->
<g>
<path d="M998,626 L972,660 L998,660 z" fill="#c25a49"/>
<rect x="998" y="620" width="336" height="72" rx="14" fill="#c25a49"/>
<text x="1020" y="656" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-style="italic" font-weight="600" fill="#fbeee9">Why was this request blocked?</text>
<text x="1316" y="681" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#f7d9d0" text-anchor="end">&#8212; Developer</text>
</g>
<!-- B4 gold · Platform -->
<g>
<path d="M1188,746 L1162,780 L1188,780 z" fill="#d9a441"/>
<rect x="1188" y="740" width="384" height="96" rx="14" fill="#d9a441"/>
<text x="1210" y="776" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-style="italic" font-weight="600" fill="#241a08">Who approved this agent, and</text>

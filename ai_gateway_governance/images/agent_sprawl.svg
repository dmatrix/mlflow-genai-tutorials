<!-- ============ right column: title + subtitle ============ -->
<text x="980" y="188" font-family="Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="800" fill="#e5836b" letter-spacing="-1">Agent Sprawl</text>
<text x="982" y="238" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-style="italic" font-weight="400" fill="#c7d3e2">Every new agent adds another API key, another bill,</text>

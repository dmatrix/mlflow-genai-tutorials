<text x="1554" y="825" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#5c4715" text-anchor="end">&#8212; Platform</text>
</g>

<!-- ============ footer bridge to the architecture image ============ -->
<line x1="60" y1="946" x2="1540" y2="946" stroke="#20304a" stroke-width="1.2"/>
<text x="60" y="984" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#8a97ab">Five coding agents, five API keys, zero oversight.</text>
<text x="1540" y="984" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#e0a43b" text-anchor="end">One MLflow AI Gateway governs all five &#8594;</text>
